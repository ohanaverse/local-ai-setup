name: modelman-ci

on:
  push:
    branches: [main]
    paths:
      - "modelman/**"
      - "docs/contracts/**"
      - ".github/workflows/modelman-ci.yml"
  pull_request:
    paths:
      - "modelman/**"
      - "docs/contracts/**"
      - ".github/workflows/modelman-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: modelman
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: make check
      - run: make test
