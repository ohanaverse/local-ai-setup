name: shell-ci

on:
  push:
    branches: [main]
    paths:
      - "bin/**"
      - "benchmarks/**"
      - "docs/**"
      - "litellm-session-logs/**"
      - "Makefile"
      - ".github/workflows/shell-ci.yml"
  pull_request:
    paths:
      - "bin/**"
      - "benchmarks/**"
      - "docs/**"
      - "litellm-session-logs/**"
      - "Makefile"
      - ".github/workflows/shell-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make lint
