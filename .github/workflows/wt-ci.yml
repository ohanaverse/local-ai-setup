name: wt-ci

on:
  push:
    branches: [main]
    paths:
      - "wt/**"
      - "docs/contracts/**"
  pull_request:
    paths:
      - "wt/**"
      - "docs/contracts/**"

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
