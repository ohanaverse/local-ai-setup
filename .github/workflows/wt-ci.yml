name: wt-ci

on:
  push:
    branches: [main]
    paths:
      - "wt/**"
      - "docs/contracts/**"
      - "bin/check-config-dirs-untouched"
      - ".github/workflows/wt-ci.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "wt/**"
      - "docs/contracts/**"
      - "bin/check-config-dirs-untouched"
      - ".github/workflows/wt-ci.yml"

env:
  # The subprocess-heavy packages run in their own test job (test-git-heavy);
  # everything else runs in test. One pattern consumed by both jobs, so the
  # split has a single source and a new package can only land in the bulk.
  GIT_HEAVY_RE: /(removal|rescue|cleanup|rootmove)$

jobs:
  # The stack gate: green here means the PR is a sound base to build the next
  # PR of a series on. It runs lint, build, vet and the tests of just the
  # packages this PR touches, so a typical diff gets its verdict in ~2-3 min
  # instead of waiting out the full suite. The full suite (test,
  # test-git-heavy, single-p) stays the merge gate - green here is not a
  # merge-able PR. Pull requests only: the changed set is the PR's own diff
  # against its base branch, so a stacked PR judges only its own commits.
  fast-verdict:
    name: fast verdict (green = safe to stack the next PR on)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wt
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changed-set diff below needs the merge base
          # with the PR's base branch.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          cache-dependency-path: wt/go.sum
      - run: brew install shellcheck
      - run: make lint
      - run: make go-format-check
      - run: go build ./...
      - run: go vet ./...
      - name: go test the packages this PR touches
        # Only the changed packages' own tests, not their dependents' - the
        # full suite still runs beside this job as the merge gate. A change
        # to nothing a wt test reads (docs, go.mod alone) tests nothing here;
        # fixtures and testdata map to the packages that read them.
        # -timeout 20m matches test-git-heavy: a git-heavy package's suite can
        # exceed go's default 10m per-package timeout on a slow runner.
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF}"
          # --diff-filter=d: a deleted .go file's directory may be gone (a
          # removed package), and `go test ./gone` would fail the gate.
          changed=$(git diff --name-only --diff-filter=d "$base"...HEAD)
          # A .go file maps to its own package. Any other file under wt/
          # (testdata, a go:embed asset) maps to the package that owns it:
          # strip a /testdata/... tail, keep the directory only if it holds
          # .go files. A docs/contracts/ fixture maps to every package whose
          # tests name docs/contracts (the cross-language contract tests).
          dirs=$(
            {
              printf '%s\n' "$changed" \
                | sed -n 's|^wt/\(.*\)/[^/]*\.go$|\1|p; s|^wt/\([^/]*\.go\)$|.|p'
              printf '%s\n' "$changed" | grep -E '^wt/.+/' | grep -vE '\.go$' \
                | sed 's|/testdata/.*|/x|; s|^wt/||; s|/[^/]*$||' \
                | while IFS= read -r d; do
                    ls "$d"/*.go >/dev/null 2>&1 && echo "$d"
                  done
              if printf '%s\n' "$changed" | grep -q '^docs/contracts/'; then
                grep -rl --include='*_test.go' 'docs/contracts' . | xargs -n1 dirname \
                  | sed 's|^\./||'
              fi
            } | sort -u | sed '/^$/d'
          )
          if [ -z "$dirs" ]; then
            echo "No .go file under wt/ changed; nothing extra to test."
            exit 0
          fi
          echo "Changed packages:"
          echo "$dirs"
          # shellcheck disable=SC2046 # dirs are repo paths without spaces
          go test -timeout 20m $(printf './%s\n' $dirs)
      - name: Tests left the real config directories alone
        run: ../bin/check-config-dirs-untouched

  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          # setup-go looks for go.sum at the repo root by default, but the
          # module lives in wt/, so without this the module cache never restores.
          cache-dependency-path: wt/go.sum
      # wt/Makefile's lint covers the launcher shims and smoke script; the Go
      # steps below don't, and nothing else in CI shellchecks files under wt/.
      # shellcheck is not preinstalled on the macos runner image (and not in
      # the core Homebrew taps), so install it explicitly — wt's lint target
      # hard-fails without it by design (it's a local dev prerequisite).
      - run: brew install shellcheck
      - run: make lint
      # gofmt ships with the Go toolchain, so unlike shfmt it needs no install.
      - run: make go-format-check
      - run: go build ./...
      - run: go vet ./...
      # The split: the git-heavy packages spawn a git process per operation
      # and dominate the wall (removal alone ~9 min on the runner); they run
      # in test-git-heavy beside this job. Anything not matching
      # GIT_HEAVY_RE lands here automatically - no package can be forgotten.
      - name: go test (all but the git-heavy packages)
        run: |
          set -euo pipefail
          all=$(go list ./...)
          # grep exits 1 on no match; under pipefail that would end the step
          # before the guard below could name the cause.
          pkgs=$(grep -vE "$GIT_HEAVY_RE" <<<"$all" || true)
          if [ -z "$pkgs" ]; then echo "No non-git-heavy packages: the split regex matched everything."; exit 1; fi
          go test $pkgs
      # No test may create the real config directories; see the script for
      # why. Run right after the tests, before any later step could create
      # them for its own reasons.
      - name: Tests left the real config directories alone
        run: ../bin/check-config-dirs-untouched

  # The git-heavy packages (removal, rescue, cleanup, rootmove): nearly every
  # test spawns git subprocesses and they carry the suite - measured on
  # macos-latest, removal 545s, cleanup 231s, rescue 209s, rootmove 125s,
  # while the whole rest tops out at cmd/wt 240s. Their own job beside test
  # (deliberately no needs:) so the wall is max(removal, everything else)
  # instead of one blob, and their runner-speed wobble shows in one check.
  # The set lives in GIT_HEAVY_RE (workflow env) - both split jobs read it.
  test-git-heavy:
    name: go test, git-heavy packages
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          # See the test job for why this is set explicitly.
          cache-dependency-path: wt/go.sum
      - name: go test (git-heavy)
        # -timeout 20m: removal's serial test sum is ~545s on the runner,
        # within 10% of go test's default 10m per-package timeout, and a
        # 12-26% slower host crosses it (run 42728452039: "panic: test timed
        # out after 10m0s", FAIL 600.058s on a 15s-old test). 20m keeps hang
        # detection at 2x the worst observed until the git-heavy suites
        # themselves get fast.
        run: |
          set -euo pipefail
          all=$(go list ./...)
          pkgs=$(grep -E "$GIT_HEAVY_RE" <<<"$all" || true)
          if [ -z "$pkgs" ]; then echo "GIT_HEAVY_RE matched no package."; exit 1; fi
          go test -timeout 20m $pkgs
      # This job runs tests too, so it carries the same guard as test's last
      # step - every job that runs go test guards its own VM's config home.
      - name: Tests left the real config directories alone
        run: ../bin/check-config-dirs-untouched

  # The packages that spawn goroutines or sleep, on a single P. A test that
  # asserts on something a spawned goroutine did is ordered correctly only
  # by luck of the runner's core count: the tui start flow's startModel
  # call-count assertions passed on a many-core dev machine and failed on
  # CI. macos-latest's core count is not ours to choose, so pin the worst
  # case here instead of depending on it.
  # Its own job beside test (deliberately no needs:, so they run at once):
  # at one P each test binary is serial and the pass is slow on the runner,
  # so as a step it adds its whole duration to PR wall clock, while as a job
  # it adds only runner minutes. Runs on every event, pull requests included: a
  # core-count flake caught on a PR beats one found on main. The git-heavy
  # packages removal, rescue and rootmove are the slow ones and do not
  # depend on core count; cleanup is enrolled in the list below.
  # The package list and the reason -count=1 is load-bearing live in
  # wt/Makefile's single-p target — edit the list there; the same target
  # runs the pass locally (`cd wt && make single-p`) and in test-all.
  single-p:
    name: Single-P tests (goroutine-sensitive packages)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
          # See the test job for why this is set explicitly.
          cache-dependency-path: wt/go.sum
      - name: GOMAXPROCS=1 go test (goroutine-sensitive packages)
        run: make single-p
      # This job runs tests too, so it carries the same guard as test's last
      # step — two jobs, two runner VMs, two config homes to keep untouched.
      - name: Tests left the real config directories alone
        run: ../bin/check-config-dirs-untouched
