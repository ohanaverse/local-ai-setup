# benchmarks/suites/eval-five-way.toml
#
# Compares five rows on the llmbench eval categories:
#   - sushi  Qwen3.8-Flash-Next STQ 2.75bpw pack
#   - ollama qwen3.8:27b-mlx
#   - rec    flint
#   - mtplx  Qwen3.8-27B-MTPLX-Optimized-Quality
#   - mtplx  Qwen3.6-35B-A3B-MTPLX-Optimized-Balance
#
# Before running:
#   - sudo sysctl iogpu.wired_limit_mb=59000   (resets on reboot; wt and
#     llmbench refuse to start Sushi below ~51,934 MiB)
#   - install the wt built from this change and add the registry rows from
#     guide 02 Step 4 BEFORE loading this suite: a row naming an unknown
#     model fails load_suite. Register the pack with
#     wt model add sushi beamster/Qwen3.8-Flash-Next-Sushi-STQ-2.75bpw --family <family>
#     which gives it the id this suite's sushi row names.
#
# Run notes:
#   - Start with samples = 1 (judge quota; see below), then raise it.
#   - Context is fixed at 131072 by wt's Spawn literal for Sushi.
#   - Thinking is left at the defaults on every row (decision 15).
#   - Sushi is expected to serve one request at a time: its defaults read
#     --max-concurrent 1 and a 300 s stall timeout in `sushi serve --help`
#     during the design (UNVERIFIED, not re-run; guide 11 says the same).
#     Do not point other clients at it during a run.
#   - Rows run serially, Sushi first; its restore action stops Sushi before
#     the claude-cli judge runs.
name = "eval-five-way"
cooldown_s = 15.0

# samples = 1: the claude-cli judge spends Claude-subscription quota, and the
# guide advises starting with a single sample.
[judge]
model = "claude-opus-5-5"
temperature = 0.0
samples = 1
max_attempts = 2
route = "claude-cli"

# Sampling is pinned explicitly so every row runs identically.
[generation]
temperature = 1.0
top_p = 0.95
top_k = 20

[coding]
dataset = "humaneval"
# EvalPlus caps replies at 768 tokens, which a thinking model spends on its
# reasoning (0% pass@1). Raised via evalplus_launcher.py. 164 problems at this
# cap can pass the 4 h default per row; raise timeout_s if a row reports
# "evalplus timed out".
max_new_tokens = 16384

[routes.direct.sushi]
base_url = "http://localhost:12345/v1"

[[rows]]
model = "sushi/beamster/Qwen3.8-Flash-Next-Sushi-STQ-2.75bpw"
provider = "sushi"
route = "direct"

[routes.direct.mtplx]
base_url = "http://localhost:8003/v1"

[routes.direct.rec]
base_url = "http://127.0.0.1:11500/v1"

[[rows]]
model = "ollama/qwen3.8:27b-mlx"
route = "litellm"

[[rows]]
model = "rec/flint"
provider = "rec"
route = "direct"

[[rows]]
model = "mtplx/Youssofal/Qwen3.8-27B-MTPLX-Optimized-Quality"
provider = "mtplx"
route = "direct"

[[rows]]
model = "mtplx/Youssofal--Qwen3.6-35B-A3B-MTPLX-Optimized-Balance"
provider = "mtplx"
route = "direct"
