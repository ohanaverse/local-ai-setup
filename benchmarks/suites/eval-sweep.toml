# benchmarks/suites/eval-sweep.toml
name = "eval-sweep"
cooldown_s = 15.0

[judge]
model = "anthropic/claude-opus-5"
temperature = 0.0
samples = 3
max_attempts = 2
route = "openrouter"
# Alternative: judge on a Claude subscription (logged-in `claude` CLI, no
# OpenRouter key). Temperature is ignored on this route; pin a full model
# name and start with samples = 1 (subscription usage limits).
#   model = "claude-opus-5-5"
#   samples = 1
#   route = "claude-cli"

# No [coding] limit: EvalPlus 0.3.1's grading step requires every problem
# in the FULL dataset (164 for humaneval) to have a sample before it
# computes pass@k, so any `limit` smaller than the dataset size makes the
# coding category fail with an EVALPLUS_ERROR instead of a score. Leave
# limit unset (or set it to the full dataset size) for a real score.
[coding]
dataset = "humaneval"

[routes.direct.omlx]
base_url = "http://localhost:8000/v1"

[[rows]]
model = "ollama/qwen3.8:27b-mlx"
route = "litellm"

[[rows]]
model = "omlx/mlx-community--Qwen3.8-27B-4bit"
provider = "omlx"
route = "direct"
direct_model = "Qwen3.8-27B-4bit"

[[rows]]
model = "ollama/glm-5.3-flash:cloud"
route = "litellm"
categories = ["coding", "reasoning"]
