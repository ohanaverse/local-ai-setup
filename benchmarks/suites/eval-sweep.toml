samples = 3
max_attempts = 2
route = "openrouter"

[coding]
dataset = "humaneval"
limit = 40

[routes.direct.omlx]
base_url = "http://localhost:8000/v1"

[[rows]]
model = "ollama/qwen3.8:27b-mlx"
route = "litellm"

[[rows]]
model = "omlx/mlx-community--Qwen3.8-27B-4bit"
