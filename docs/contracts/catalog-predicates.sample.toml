# Contract for the catalog / pricing / routing predicates (#179, #180). Each
# model exercises one branch; the expected id lists live in
# catalog-predicates.expected.json, read by:
#   - wt/internal/config/catalog_predicates_fixture_test.go  (in_catalog, openrouter_priced)
#   - wt/internal/litellm/catalog_predicates_fixture_test.go (routable_cloud)
#   - wt/internal/cloudsync/openrouter_test.go (openrouter_priced, over registry rows)
# Go only.

[[providers]]
id = "openrouter"
name = "OpenRouter"
location = "cloud"
[providers.auth]
type = "api_key"
base_url = "https://openrouter.ai/api/v1"
secret_ref = "OPENROUTER_API_KEY"

[[providers]]
id = "agy"
name = "Agy"
location = "cloud"
[providers.auth]
type = "native"

[[providers]]
id = "ollama"
name = "Ollama"
location = "local"
[providers.auth]
type = "none"
base_url = "http://localhost:11434"

# A non-native cloud provider with no LiteLLM mapping in wt's policy table.
[[providers]]
id = "acme"
name = "Acme"
location = "cloud"
[providers.auth]
type = "api_key"
base_url = "https://acme.example/v1"
secret_ref = "ACME_API_KEY"

# A provider row that still carries openrouter_priced, a key wt read until
# #322 and no longer does: the row loads and the key says nothing. (It was
# false here: a corporate LiteLLM gateway whose model names are not
# OpenRouter ids.)
[[providers]]
id = "corp-litellm"
name = "Corp LiteLLM"
location = "cloud"
openrouter_priced = false
[providers.auth]
type = "api_key"
base_url = "https://litellm.corp.example"
secret_ref = "exec:/usr/local/bin/corp-credential-helper.sh"

# The same key the other way round, true on a local provider (a local proxy
# serving OpenRouter ids). It is ignored too: only a model whose provider_id
# is "openrouter" is OpenRouter-priced, in both readers (the typed config and
# the cloud-sync rows).
[[providers]]
id = "local-gateway"
name = "Local gateway"
location = "local"
openrouter_priced = true
[providers.auth]
type = "none"
base_url = "http://localhost:4100/v1"

# A provider whose location is mistyped (#200): neither "local" nor "cloud",
# so it is not a location. Its model is out of the catalog, is not routed, and
# is not OpenRouter-priced (its provider is not "openrouter").
[[providers]]
id = "typo"
name = "Mistyped location"
location = "Cloud"

[providers.auth]
type = "api_key"
base_url = "https://typo.example/v1"
secret_ref = "sk-fixture"

[[models]]
id = "openrouter/vendor-x"
family = "fixture"
provider_id = "openrouter"
model_name = "vendor/x"

[[models]]
id = "agy/native"
family = "fixture"
provider_id = "agy"
model_name = "native"

# ollama cloud model: cloud location on the LOCAL ollama provider.
[[models]]
id = "ollama/glm:cloud"
family = "fixture"
provider_id = "ollama"
model_name = "glm:cloud"
location = "cloud"

# Inherits "cloud" from the acme provider. A cloud provider that is not
# "openrouter": not OpenRouter-priced.
[[models]]
id = "acme/model-a"
family = "fixture"
provider_id = "acme"
model_name = "vendor/model-a"

# Not OpenRouter-priced: its provider is not "openrouter". (The provider
# row's openrouter_priced = false is not what decides it.)
[[models]]
id = "corp-litellm/claude-3"
family = "fixture"
provider_id = "corp-litellm"
model_name = "claude-3"

# Not OpenRouter-priced either, whatever its provider row's
# openrouter_priced = true once meant. In the catalog as any local model is;
# not a cloud route.
[[models]]
id = "local-gateway/vendor-y"
family = "fixture"
provider_id = "local-gateway"
model_name = "vendor/y"

# Dangling provider_id: no [[providers]] entry named "ghost".
[[models]]
id = "ghost/model-g"
family = "fixture"
provider_id = "ghost"
model_name = "model-g"
location = "cloud"

[[models]]
id = "ollama/local:1"
family = "fixture"
provider_id = "ollama"
model_name = "local:1"
location = "local"

# Inherits the mistyped provider location above: not in the catalog.
[[models]]
id = "typo/model-t"
family = "fixture"
provider_id = "typo"
model_name = "model-t"

# A model-level typo on an otherwise healthy local provider (#200): the
# model's own location wins over the provider's, and it is not a location.
[[models]]
id = "ollama/typo:1"
family = "fixture"
provider_id = "ollama"
model_name = "typo:1"
location = "Local"
