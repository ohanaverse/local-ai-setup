# Fixture for modelman.toml, the state file modelman wrote, of which wt
# reads one table. wt reads only one thing here: the `[litellm]` table below (a
# legacy fallback — the routing table is wt-owned in wt's config.toml). It
# no longer reads `price_refresh_last_run`: its stale-pricing notice takes
# its date from the `pricing_updated_at` stamps in registry.toml. wt reads
# NO per-model [model_state] key: `ready`/`downloaded` (download state),
# `running` and the retired `exposed` flags are modelman's alone; wt takes
# local presence and running state from its live probes of the providers.
#
# Read by:
#   - wt/internal/config/modelman_fixture_test.go (Go)
#
# It goes when wt stops reading the file.
#
# Exposure (#179): what is configured in registry.toml is exposed, so
# modelman no longer has an `exposed` flag — it ignores `exposed` /
# `litellm_exposed` on read and drops them on the next save. wt does not
# read them either. The rows below that still carry one pin that both
# readers load such a pre-#179 file and ignore the keys.
#
# Local-model running state (multi-model local lifecycle design,
# 2026-09-14): each model_state entry carries its own `running` flag.
# It is modelman-owned: modelman writes it and verifies it with a live
# probe before trusting it. wt does NOT read it (wt stopped parsing it)
# — wt probes the providers itself. See
# docs/superpowers/specs/2026-09-14-local-model-lifecycle-design.md.
# The single [local].running_model marker (issue #65) is retired.

# Global "token pricing last refreshed" date (YYYY-MM-DD), written by
# `modelman refresh-prices` (set_price_refresh_last_run in state.py).
# modelman's own; wt no longer reads it (the Go test only checks that a
# file carrying it still loads).
price_refresh_last_run = "2026-09-14"

[litellm]
enabled = true
url = "http://localhost:4000"
api_key = "sk-litellm-CONTRACT-FIXTURE-NOT-A-REAL-KEY"

[model_state."ollama/contract-fixture:local"]
ready = true
disk_path = "ollama:contract-fixture:local"
size_bytes = 2147483648
# legacy key (#179) — both readers ignore it
exposed = false
running = true

[model_state."ollama/contract-fixture:subscription"]
ready = true
disk_path = "ollama:contract-fixture:subscription"
size_bytes = 1073741824
# legacy key (#179) — both readers ignore it
exposed = true

# Legacy pre-registry spelling of `ready`. modelman still accepts it
# (state.py reads ready, falling back to downloaded); wt ignores it like
# every per-model key. This entry carries the older `litellm_exposed` spelling (no
# `exposed` key), which both readers ignore (#179).
[model_state."llamacpp/legacy-contract-fixture"]
downloaded = true
disk_path = "/hf/cache/legacy-contract-fixture.q4.gguf"
# legacy key (#179) — both readers ignore it
litellm_exposed = true

# A model that exists in state but was never downloaded: all defaults.
# modelman yields ready=false.
[model_state."openrouter/contract-fixture:cloud"]

# Local model that is not ready: modelman must yield ready=false.
[model_state."ollama/contract-fixture:local-not-ready"]
ready = false
disk_path = "ollama:contract-fixture:local-not-ready"
size_bytes = 1073741824

# Legacy family display names. Writers no longer create these (display
# names live in registry.toml [[families]]); entries stay loadable so
# pre-existing files keep working. wt never reads this table.
[families."contract-fixture"]
display_name = "Contract Fixture (legacy)"
