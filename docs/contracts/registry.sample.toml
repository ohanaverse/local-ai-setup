# Shared fixture for cross-language contract tests. Exercises every schema
# variant modelman writes and wt reads: all three provider auth types
# (none, api_key, native), full per-token + subscription pricing, model_info,
# a per-model location override, and a free model. Since #179 Phase B it also
# pins local overlay matching: a local registry entry is an overlay matched to
# a discovered model by provider family + model_name, never by id — so an id
# spelling "/" as "--" matches exactly like one shaped provider/model_name, and
# an overlay whose artifact is not on disk is parsed by both sides but gets no
# row in wt's catalog.
#
# `base_url` is an origin (scheme://host:port) — no wire-protocol suffix.
# Readers normalize (`base_origin`/`BaseOrigin`) before use; drivers append
# their own suffix (e.g. "/v1"). Do not change existing base_url values —
# they are written verbatim into ~/.config/litellm/config.yaml.
#
# `protocols` declares which wire protocols this provider serves natively.
# Absent -> ["openai-chat"]. An agent that speaks none of a provider's
# protocols is routed through LiteLLM regardless of the on/off setting.
#
# Read by:
#   - wt/internal/config/registry_fixture_test.go (Go)
#   - wt/internal/catalog/registry_fixture_test.go (Go)
#   - wt/cmd/wt/litellm_test.go (Go)
#   - modelman/tests/contracts/test_registry_fixture.py (Python)
#   - llmbench/tests/test_registry.py (Python; reads id/family/provider_id/
#     model_name/location/fetch/draft only)
#
# The point of this file is that changing a field here without updating
# every test listed above should make each of their CI jobs (wt-ci,
# modelman-ci, llmbench-ci) fail in the same PR.

[[providers]]
id = "ollama"
name = "Ollama"
location = "local"
protocols = ["anthropic", "openai-chat"]
[providers.auth]
type = "none"
base_url = "http://localhost:11434"

[[providers]]
id = "openrouter"
name = "OpenRouter"
location = "cloud"
protocols = ["openai-chat"]
[providers.auth]
type = "api_key"
base_url = "https://openrouter.ai/api/v1"
secret_ref = "OPENROUTER_API_KEY"

[[providers]]
id = "agy"
name = "Agy"
location = "cloud"
[providers.auth]
type = "native"

[[providers]]
id = "pinned-cloud"
name = "Pinned Cloud"
location = "cloud"
[providers.auth]
type = "api_key"
base_url = "https://pinned-cloud.example/v1"
secret_ref = "PINNED_CLOUD_API_KEY"

# mlx_lm_server: a local target+draft speculative-decoding pairing served by
# mlx_lm.server --draft-model. Mirrors the default template modelman writes
# (registry.py _DEFAULT_PROVIDER_TEMPLATES) — auth.type "none" with the
# OpenAI-compatible base_url, no model_dir (the default template omits it).
[[providers]]
id = "mlx_lm_server"
name = "mlx-lm server (target+draft)"
location = "local"
[providers.auth]
type = "none"
base_url = "http://localhost:8001/v1"

# mtplx: a single-model local server whose on-disk artifacts are
# "<org>--<model>" directories, discovered as "org/model".
[[providers]]
id = "mtplx"
name = "MTPLX"
location = "local"
[providers.auth]
type = "none"
base_url = "http://localhost:8003/v1"

[[families]]
name = "contract-fixture"
display_name = "Contract Fixture"

[[models]]
id = "ollama/contract-fixture:local"
family = "contract-fixture"
provider_id = "ollama"
model_name = "contract-fixture:local"
tags = ["code"]
# Free model: no cost fields.

[[models]]
id = "openrouter/contract-fixture:cloud"
family = "contract-fixture"
provider_id = "openrouter"
model_name = "org/contract-fixture-cloud"
location = "cloud"
tags = ["design"]
model_info = { supports_function_calling = true }
[models.cost]
input_price_per_million  = 0.50
cache_price_per_million  = 0.25
output_price_per_million = 1.00
subscription_price       = 19.99
subscription_period      = "month"
# Time-windowed price rows (2026-09-28 ollama-catalog-sync design): the
# flat prices above are the default; the first row whose window contains
# the instant (in its IANA timezone) overrides each field it sets.
[[models.cost.time_prices]]
label    = "off-peak"
timezone = "UTC"
input_price_per_million  = 0.25
cache_price_per_million  = 0.125
output_price_per_million = 0.50
windows = [
  { days = ["mon", "tue", "wed", "thu", "fri"], start = "00:00", end = "12:00" },
  { days = ["mon", "tue", "wed", "thu", "fri"], start = "18:00", end = "24:00" },
  { days = ["sat", "sun"], start = "00:00", end = "24:00" },
]

[[models]]
id = "agy/contract-fixture:native"
family = "contract-fixture"
provider_id = "agy"
model_name = "contract-fixture:native"
tags = ["native"]

# Provider-inherited location: model omits `location`, inheriting the
# provider's "cloud". Both exposure predicates must treat this as cloud
# (issue #46).
[[models]]
id = "pinned-cloud/contract-fixture:inherit"
family = "contract-fixture"
provider_id = "pinned-cloud"
model_name = "org/contract-fixture-inherit"
tags = ["code"]

# mlx_lm_server pairing: a target+draft speculative-decoding pair. The
# `fetch` names the target repo and `draft` the draft repo — the shape
# modelman writes for mlx_lm_server models. wt decodes the provider/model
# rows, and reads `repo` and `local_path` of fetch and of draft to show them
# and to name the pairing in a hint; it writes the two tables only when
# `wt model add mlx_lm_server <target> --draft <draft>` registers a pairing,
# and never changes them afterwards.
[[models]]
id = "mlx_lm_server/contract-fixture:pair"
family = "contract-fixture"
provider_id = "mlx_lm_server"
model_name = "org/contract-fixture-target"
tags = ["code"]
[models.fetch]
repo = "org/contract-fixture-target"
[models.draft]
repo = "org/contract-fixture-draft"

# Local overlay whose id spells the repo's "/" as "--" (the legacy shape two
# reference-host ids use). It matches the discovered artifact
# "org/contract-fixture-dashed" through model_name, not through its id.
[[models]]
id = "mtplx/org--contract-fixture-dashed"
family = "contract-fixture"
provider_id = "mtplx"
model_name = "org/contract-fixture-dashed"
tags = ["code"]

# Local overlay that is not on disk: still a valid registry entry (modelman
# lists it as downloadable), but wt's catalog has no row for it.
[[models]]
id = "ollama/contract-fixture:absent"
family = "contract-fixture"
provider_id = "ollama"
model_name = "contract-fixture:absent"
tags = ["code"]
