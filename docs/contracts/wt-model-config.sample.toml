# wt-model's configuration. [litellm] is written only by `wt-model litellm set`
# and `wt litellm set`; the api key is never here — it lives in the 0600 file
# that key_file names. [gateway] subscription_passthrough is written only by
# `wt-model gateway`; tls_cert and tls_key are hand-edited; serve reads it once, at start.
[litellm]
url = "http://localhost:4000"
key_file = "litellm.key"

[gateway]
subscription_passthrough = false
