[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmarks for local LLM models, with the provider isolation they need"
readme = "README.md"
requires-python = "==3.13.*"
authors = [
    { name = "Keith Hartmann", email = "keith.hartmann@nytimes.com" }
]
dependencies = [
    "typer>=0.15.3",
    "tomli-w>=1.2.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
eval = [
    "evalplus>=0.3.1",
]

[project.scripts]
llmbench = "llmbench.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/llmbench"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "build", "dist", ".worktrees"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (ruff format handles this)
]

[tool.ruff.lint.isort]
known-first-party = ["llmbench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
