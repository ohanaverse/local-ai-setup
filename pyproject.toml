[project]
name = "modelman"
version = "0.1.0"
description = "CLI for managing local LLM model families across providers"
readme = "README.md"
requires-python = "==3.13.*"
authors = [
    { name = "Keith Hartmann", email = "keith.hartmann@nytimes.com" }
]
dependencies = [
    "typer>=0.15.3",
    "rich>=14.0.0",
    "pyyaml>=6.0.2",
    "huggingface_hub>=1.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
modelman = "modelman.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelman"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"